<!DOCTYPE html>
<html>
<head>
    <title>AI Rumor Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            width: 40%;
            margin: 100px auto;
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00c9a7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00a68c;
        }

        .result {
            margin-top: 25px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>AI Rumor Detection</h1>

    <form method="POST" action="/predict_web">
        <input type="text" name="text" placeholder="Enter news text..." required>
        <br>
        <button type="submit">Check</button>
    </form>

    {% if result %}
    <div class="result">
        <h3>📌 Domain: {{ result.domain }}</h3>
        <h3>🔍 Prediction: {{ result.prediction }}</h3>
        <h3>📊 Confidence: {{ result.confidence }}</h3>
        <h3>💡 Reason: {{ result.reason }}</h3>
    </div>
    {% endif %}
</div>

</body>
</html>
